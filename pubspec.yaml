name: cv
description: "Artur Saidov's Resume"
publish_to: "none"
version: 0.1.1+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
flutter_intl:
  enabled: true
  class_name: L
  main_locale: en
  arb_dir: lib/_shared/arb
  output_dir: lib/_shared/generated
